- title: Kochfeld
  path: kochfeld
  icon: mdi:pot-steam
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Kochfeld
      icon: mdi:pot-steam
    - type: custom:mushroom-template-card
      entity: sensor.kochfeld_betriebszustand
      primary: '{% set m = {''inactive'':''Aus'',''ready'':''Bereit'',''run'':''In Betrieb'',''pause'':''Pausiert'',''actionrequired'':''Aktion nötig'',''finished'':''Fertig'',''error'':''Fehler''} %} {% set s = states(entity) %}{{ m.get(s, s) }}'
      secondary: '{% if is_state(''binary_sensor.kochfeld_lokale_steuerung'',''on'') %}Wird gerade am Gerät bedient{% elif is_state(''switch.kochfeld_kindersicherung'',''on'') %}Kindersicherung aktiv{% else %}Neff Kochfeld{% endif %}'
      icon: mdi:pot-steam
      icon_color: '{% set s = states(entity) %} {{ {''run'':''red'',''pause'':''amber'',''error'':''red'',''actionrequired'':''red'',''ready'':''blue''}.get(s,''grey'') }}'
      fill_container: true
      grid_options:
        columns: full
    - type: custom:mushroom-chips-card
      alignment: center
      chips:
      - type: template
        entity: binary_sensor.kochfeld_konnektivitat
        icon: '{{ ''mdi:wifi'' if is_state(entity,''on'') else ''mdi:wifi-off'' }}'
        icon_color: '{{ ''green'' if is_state(entity,''on'') else ''red'' }}'
        content: '{{ ''Online'' if is_state(entity,''on'') else ''Offline'' }}'
      - type: template
        entity: number.kochfeld_wecker
        icon: mdi:alarm
        icon_color: '{{ ''amber'' if states(entity) | int(0) > 0 else ''grey'' }}'
        content: '{% set s = states(entity) | int(0) %} {% if s > 0 %}{{ s // 60 }}:{{ ''%02d'' | format(s % 60) }} min{% else %}Kein Wecker{% endif %}'
    - type: tile
      entity: number.kochfeld_wecker
      name: Kurzzeitwecker (Sekunden)
      icon: mdi:alarm
      color: amber
      features:
      - type: numeric-input
        style: buttons
      features_position: bottom
      grid_options:
        columns: full
    - type: tile
      entity: switch.kochfeld_einschalter
      name: Eingeschaltet
      icon: mdi:power
      color: green
      grid_options:
        columns: 6
    - type: tile
      entity: switch.kochfeld_kindersicherung
      name: Kindersicherung
      icon: mdi:lock
      color: purple
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: Wecker-Favoriten
      icon: mdi:heart
    - type: custom:mushroom-template-card
