geschirrspuler_eine_stunde_8_uhr:
  alias: Geschirrspüler Eine Stunde – Start 8 Uhr
  icon: mdi:clock-start
  sequence:
  - action: home_connect.set_program_and_options
    data:
      device_id: DEINE_GESCHIRRSPUELER_DEVICE_ID
      affects_to: active_program
      program: dishcare_dishwasher_program_eco_50
      dishcare_dishwasher_option_vario_speed_plus: true
      b_s_h_common_option_start_in_relative: '{% set t = today_at(''08:00'') %}{% if now() >= t %}{% set t = t + timedelta(days=1) %}{% endif %}{{ (t - now()).total_seconds() | int }}'
  mode: single
