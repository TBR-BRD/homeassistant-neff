# Neff Küche – Skripte (Start-Buttons & Favoriten)
# https://github.com/TBR-BRD/homeassistant-neff
# In scripts.yaml einfügen. DEINE_..._DEVICE_ID ersetzen:
#   Einstellungen → Geräte → Gerät öffnen → die ID steht in der Adresszeile (/config/devices/device/<ID>)
# Hinweis: Neff lehnt Optionen ab, die ein Programm nicht kennt (z. B. Schnellaufheizen bei Pizzastufe).

backofen_starten:
  alias: Backofen starten
  icon: mdi:play
  sequence:
  - action: select.select_option
    target:
      entity_id: select.backofen_aktives_programm
    data:
      option: '{{ states(''select.backofen_ausgewahltes_programm'') }}'
  mode: single
geschirrspuler_starten:
  alias: Geschirrspüler starten
  icon: mdi:play
  sequence:
  - action: select.select_option
    target:
      entity_id: select.geschirrspuler_aktives_programm
    data:
      option: '{{ states(''select.geschirrspuler_ausgewahltes_programm'') }}'
  mode: single
backofen_pizza:
  alias: Backofen Pizza
  icon: mdi:pizza
  sequence:
  - action: home_connect.set_program_and_options
    data:
      device_id: DEINE_BACKOFEN_DEVICE_ID
      affects_to: active_program
      program: cooking_oven_program_heating_mode_pizza_setting
      cooking_oven_option_setpoint_temperature: 200
      b_s_h_common_option_duration: 1500
  mode: single
